name: Crossref contact
description: Set the shared public CI contact, with an optional repository override.
inputs:
  mailto:
    description: Optional Crossref contact override.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CROSSREF_CONTACT_OVERRIDE: ${{ inputs.mailto }}
      run: |
        contact="${CROSSREF_CONTACT_OVERRIDE:-$(cat "$GITHUB_ACTION_PATH/mailto.txt")}"
        if [[ ! "$contact" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
          echo 'The CI Crossref contact must be a single email address.' >&2
          exit 1
        fi
        echo "::add-mask::$contact"
        printf 'CROSSREF_MAILTO=%s\n' "$contact" >> "$GITHUB_ENV"
