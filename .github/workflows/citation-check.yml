name: Citation verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# All free-provider jobs in this workflow share one serial queue.
concurrency:
  group: citation-verification
  cancel-in-progress: false

jobs:
  citations:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/crossref-contact
        with:
          mailto: ${{ vars.CROSSREF_MAILTO }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - uses: actions/cache/restore@v4
        with:
          path: .bibcheck/verification.sqlite3
          key: citations-v2-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citations-v2-${{ github.ref }}-
            citations-v2-refs/heads/master-
      - name: Verify new and edited citations (manual runs check the full library)
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: python verification/check_ci.py
      - name: Save resumable database, including unresolved results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bibcheck/verification.sqlite3
          key: citations-v2-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      # After a push to master whose check passed: the results of the whole library, as this
      # run holds them, for the job below to save as verification/baseline.jsonl.gz. Nothing is
      # made unless every entry has an accepted result for its present text (crossref status).
      - name: Export the saved results of the whole library
        if: github.event_name == 'push' && success()
        continue-on-error: true    # the check's own result does not depend on this
        run: |
          if cdlbib crossref status cdl.bib; then
            cdlbib crossref snapshot .bibcheck/baseline-candidate.jsonl.gz
          else
            echo "::notice::Not every entry has an accepted result; verification/baseline.jsonl.gz is left as it is."
          fi
      - name: Hand the saved results to the next job
        if: github.event_name == 'push' && success() && hashFiles('.bibcheck/baseline-candidate.jsonl.gz') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # Named by the attempt: a run that is started again never picks up the file of an
          # earlier attempt when its own export made none.
          name: baseline-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bibcheck/baseline-candidate.jsonl.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve portable evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bibcheck/report.jsonl
            .bibcheck/checkpoint.jsonl.gz
          if-no-files-found: warn

  # Keeps verification/baseline.jsonl.gz in step with cdl.bib: after a push to master whose
  # citation check passed, the results exported above are committed when their contents differ
  # from the committed file's, and only while master is still at the commit that was checked.
  # This is the only job that may write to the repository, and it runs no code from the
  # checkout: it copies one file and commits it. A commit made with the
  # workflow's own token starts no workflow run, so this does not repeat itself.
  baseline:
    needs: citations
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - id: candidate
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baseline-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Commit the saved results when they changed
        if: steps.candidate.outcome == 'success'
        env:
          CANDIDATE: ${{ runner.temp }}/candidate/baseline-candidate.jsonl.gz
        run: |
          gzip -t "$CANDIDATE"
          # The results are those of the commit that was checked. When master is no longer at
          # that commit, they are not saved: they would stand for a library that is not the
          # one on master now, and the push that moved master has a run of its own to come.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::master has moved on from ${GITHUB_SHA::7}; its newer run saves the results."
            exit 0
          fi
          # Compared unpacked: two archives of the same lines differ in their headers.
          if [ -f verification/baseline.jsonl.gz ] && [ "$(gzip -dc "$CANDIDATE" | sha256sum)" = "$(gzip -dc verification/baseline.jsonl.gz | sha256sum)" ]; then
            echo "verification/baseline.jsonl.gz already holds these results."
            exit 0
          fi
          cp "$CANDIDATE" verification/baseline.jsonl.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/baseline.jsonl.gz
          git commit -m "verification: saved results of the library as of ${GITHUB_SHA::7} (automatic)"
          # No force and no replaying: a push that is refused means master moved in this
          # moment, and then the newer run saves the results.
          git push origin HEAD:master \
            || echo "::notice::master moved while this was being saved; its newer run saves the results."
