# This is a basic workflow to help you get started with Actions

name: autocheck

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # The format check and the test suite, on each supported Python
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: ./.github/actions/crossref-contact
        with:
          mailto: ${{ vars.CROSSREF_MAILTO }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[research]" pytest uv
      - name: run pytest
        run : |
          cdlbib verify --no-citations
          python -m pytest -q -rs tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build the wheel and install it into an empty environment
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheelenv/bin/cdlbib --version
          /tmp/wheelenv/bin/cdlbib --library "$GITHUB_WORKSPACE" verify --no-citations
