# This is a basic workflow to help you get started with Actions

name: autocheck

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Started by hand (Actions tab, or `gh workflow run autocheck --ref BRANCH`) on any branch
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # The format check and the test suite, on each supported Python
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: ./.github/actions/crossref-contact
        with:
          mailto: ${{ vars.CROSSREF_MAILTO }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The setup, export and PDF-intake tests run the real programs and skip without them:
      # kpsewhich, pdflatex, latex, xelatex, lualatex, bibtex and biber; Ghostscript (gs);
      # pdftoppm (poppler-utils) and tesseract. The TeX packages hold what the tests'
      # documents load: natbib and plainnat (latex-base), fontspec and etoolbox
      # (latex-recommended), xstring and xpatch (latex-extra), biblatex and its styles
      # (bibtex-extra), luacode (luatex), the Type 1 fonts of the T1 encoding (cm-super) and
      # Latin Modern for LuaLaTeX and XeLaTeX (lmodern, fonts-lmodern).
      - name: install TeX, Ghostscript, poppler and tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-luatex texlive-xetex biber \
            cm-super lmodern fonts-lmodern \
            ghostscript poppler-utils tesseract-ocr tesseract-ocr-eng
          for program in kpsewhich pdflatex latex xelatex lualatex bibtex biber gs pdftoppm tesseract; do
            command -v "$program"
          done
          pdflatex --version | head -n 1
          biber --version
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[research,pdf,tui]" pytest pytest-asyncio uv playwright
          python -m playwright install --with-deps chromium
      - name: run pytest
        run : |
          cdlbib verify --no-citations
          python -m pytest -q -rs tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build the wheel and install it into an empty environment
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheelenv/bin/cdlbib --version
          /tmp/wheelenv/bin/cdlbib --library "$GITHUB_WORKSPACE" verify --no-citations
      - name: the installed wheel has the web, setup and export commands and its packaged files
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/cdlbib web --help
          /tmp/wheelenv/bin/cdlbib setup --help
          /tmp/wheelenv/bin/cdlbib export --help
          /tmp/wheelenv/bin/python -c "from importlib import resources; from cdlbib.web import server; static = resources.files('cdlbib') / 'web' / 'static'; names = sorted({name for name, kind in server.STATIC.values()}); missing = [name for name in names if not (static / name).is_file()]; assert names and not missing, missing; data = resources.files('cdlbib') / 'data'; assert (data / 'keep_fields.txt').is_file() and (data / 'journal_key.xls').is_file(), 'packaged rule data is missing'; print('packaged in the wheel:', len(names), 'static files (the server\'s own table) and the rule data')"
