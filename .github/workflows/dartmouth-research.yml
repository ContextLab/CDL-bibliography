name: Dartmouth citation research pilot

on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact free Dartmouth model ID (availability and price checked before inference)
        default: zai-org.glm-5.3
        required: true
      search_backend:
        description: Search provider (DuckDuckGo HTML is experimental)
        type: choice
        options: [europepmc, duckduckgo]
        default: europepmc
      limit:
        description: Maximum entries in this pilot (1-10)
        default: '3'
        required: true
      keys:
        description: Optional comma-separated citation keys
      retry_failed:
        description: Deliberately retry prior failed attempts
        type: boolean
        default: false
      allowed_hosts:
        description: Comma-separated exact source/PDF hosts, including redirects
        default: arxiv.org,aclanthology.org,pmc.ncbi.nlm.nih.gov,www.ncbi.nlm.nih.gov,europepmc.org,papers.nips.cc,papers.neurips.cc,proceedings.neurips.cc,www.frontiersin.org,public-pages-files-2025.frontiersin.org
        required: true

permissions:
  contents: read

concurrency:
  group: dartmouth-citation-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[research]"
      - uses: actions/cache/restore@v4
        with:
          path: .bibcheck
          key: dartmouth-research-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dartmouth-research-v1-${{ github.ref_name }}-
      - name: Restore matching baseline reviews
        run: cdlbib crossref restore verification/baseline.jsonl.gz
      - name: Check Dartmouth model availability
        env:
          DARTMOUTH_CHAT_API_KEY: ${{ secrets.DARTMOUTH_CHAT_API_KEY }}
          BIBCHECK_RESEARCH_MODEL: ${{ inputs.model }}
        run: cdlbib-adapter-dartmouth --check-model
      - name: Collect bounded evidence
        env:
          DARTMOUTH_CHAT_API_KEY: ${{ secrets.DARTMOUTH_CHAT_API_KEY }}
          BIBCHECK_RESEARCH_MODEL: ${{ inputs.model }}
          BIBCHECK_SEARCH_BACKEND: ${{ inputs.search_backend }}
          PILOT_LIMIT: ${{ inputs.limit }}
          PILOT_KEYS: ${{ inputs.keys }}
          PILOT_RETRY: ${{ inputs.retry_failed }}
          PILOT_HOSTS: ${{ inputs.allowed_hosts }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          limit = int(os.environ['PILOT_LIMIT'])
          if not 1 <= limit <= 10:
              raise SystemExit('Pilot limit must be between 1 and 10')
          command = ['cdlbib', 'crossref', 'research-batch',
                     'cdl.bib', '--adapter', 'cdlbib-adapter-dartmouth',
                     '--limit', str(limit)]
          hosts = [h.strip() for h in os.environ['PILOT_HOSTS'].split(',') if h.strip()]
          if not hosts:
              raise SystemExit('At least one source host is required')
          for host in hosts:
              command.extend(['--allow-host', host])
          if os.environ['PILOT_RETRY'] == 'true':
              command.append('--retry-failed')
          if os.environ.get('PILOT_KEYS', '').strip():
              keys = [k.strip() for k in os.environ['PILOT_KEYS'].split(',') if k.strip()]
              Path('.bibcheck/pilot-keys.txt').write_text('\n'.join(keys) + '\n')
              command.extend(['--keys', '.bibcheck/pilot-keys.txt'])
          subprocess.run(command, check=True)
          PY
      - name: Export checkpoint, including failures
        if: always()
        run: cdlbib crossref snapshot verification/dartmouth-pilot.jsonl.gz
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .bibcheck
          key: dartmouth-research-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dartmouth-citation-evidence-${{ github.run_id }}
          path: verification/dartmouth-pilot.jsonl.gz
          retention-days: 30
